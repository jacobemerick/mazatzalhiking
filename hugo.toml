# mazatzalhiking.com — Hugo builds the pages; Cloudflare serves them as static assets.
# Decisions in docs/site-pages.md.
baseURL = "https://mazatzalhiking.com/"
languageCode = "en"
title = "Mazatzal Hiking"
timeZone = "America/Phoenix"

# Page lastmod (and so the sitemap's) comes from the last commit touching the file:
# a trail page is "updated" when a note is added to it, which is the truth.
enableGitInfo = true
enableRobotsTXT = true

# Match the Workers Builds HUGO_VERSION variable and the local install.
[module]
  [module.hugoVersion]
    min = "0.157.0"

# Six page types and nothing else (#20): no taxonomies, no RSS, no section pages
# beyond /trails/. An empty taxonomies table switches off Hugo's built-in
# tags/categories, which would otherwise publish term pages nobody decided to have.
[taxonomies]

disableKinds = ["taxonomy", "term", "rss"]

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

# The sitemap is the generator's job because Hugo is the one thing that knows every
# URL. The builder is a static file under static/build/ and carries noindex, so it is
# not a content page and never appears here.
[sitemap]
  changefreq = ""
  priority = -1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      title = true

[permalinks]
  [permalinks.page]
    trails = "/trails/:slug/"

[params]
  # THE LAUNCH SWITCH (#47). false: the route builder carries noindex, robots.txt
  # disallows /build/, the sitemap leaves it out and the landing page does not link
  # to it. true: all four open at once. Flip it in a PR of its own, after Jacob has
  # gone through the pages himself.
  builderPublic = true
  description = "Build GPX and KML routes for the Mazatzal Wilderness from GPS tracks that have been walked."
  analyticsToken = "5b79bb3f6d16425f920c429acb8d4a59"
  # The contact form's Turnstile widget (public; its secret is the TURNSTILE_SECRET
  # Worker secret). This is Cloudflare's always-pass test key until the real one exists.
  turnstileSiteKey = "0x4AAAAAAFBPvyR0rCP0W0Qu"

# Site links, in one place. main is the top nav (pages on this site); footer is
# everything off-site, and every footer link opens in a new tab.
[menus]
  [[menus.main]]
    name = "Trails"
    url = "/trails/"
    weight = 10
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 20

  [[menus.footer]]
    name = "GitHub"
    url = "https://github.com/jacobemerick/mazatzalhiking"
    weight = 10
  [[menus.footer]]
    name = "HikeArizona"
    url = "https://hikearizona.com/"
    weight = 20
  [[menus.footer]]
    name = "Tonto National Forest"
    url = "https://www.fs.usda.gov/tonto"
    weight = 30
