<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off trail — Mazatzal Hiking</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17150f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317150f'/%3E%3Cpath d='M4 24l7-11 4 6 3-5 10 10z' fill='%23d9a441'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #17150f;
    --sand: #faf6ef;
    --gold: #d9a441;
    --clay: #c8703f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--ink);
    color: var(--sand);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 44ch; text-align: center; }
  svg.mark { display: block; margin: 0 auto 2rem; }
  svg.mark .route { fill: none; stroke: var(--clay); stroke-width: 2.6; stroke-linecap: round; }
  svg.mark .lost { fill: none; stroke: rgba(250,246,239,.28); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 3 7; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .74rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 1rem;
  }
  h1 {
    font-family: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 1rem;
  }
  p { color: rgba(250,246,239,.7); margin: 0 0 2rem; }
  a {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .75rem 1.5rem;
    border-radius: 999px;
    background: var(--gold);
    color: var(--ink);
    font-size: .95rem;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #e6b455; }
</style>
</head>
<body>
<main>
  <svg class="mark" width="130" height="90" viewBox="0 0 130 90" aria-hidden="true">
    <path class="route" d="M12 74 C 34 68 42 44 62 38"/>
    <path class="lost" d="M62 38 C 78 33 84 52 100 44 C 112 38 110 22 120 18"/>
    <circle cx="12" cy="74" r="5" fill="#faf6ef"/>
    <circle cx="62" cy="38" r="4" fill="#c8703f"/>
  </svg>

  <p class="code">Error 404</p>
  <h1>The trail ends here.</h1>
  <p>Cairns run out sometimes. This page doesn't exist — head back and pick up the route from the trailhead.</p>
  <a href="/">Back to the start</a>
</main>

</body>
</html>
