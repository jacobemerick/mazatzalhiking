<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ partial "head-meta.html" . }}
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 26l8-13 4.5 7L18 14l12 12z" fill="#d9a441"/></svg>
      Mazatzal Hiking
    </a>
    {{ partial "site-nav.html" . }}
  </div>
</header>
<main class="wrap{{ with .Params.prose }} prose{{ end }}">
{{ block "main" . }}{{ end }}
</main>
{{ partial "site-foot.html" . }}
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ site.Params.analyticsToken }}"}'></script>
</body>
</html>
