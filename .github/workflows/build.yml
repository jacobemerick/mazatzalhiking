name: Build

# The same build Cloudflare runs, on every pull request, so a note that does not parse
# or a template that drifts from conditions.js is red here before it is merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUGO_VERSION: '0.157.0'   # matches hugo.toml and the Workers Builds variable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Hugo
        run: |
          curl -sSfL --retry 6 --retry-all-errors -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - run: ./tools/build.sh
